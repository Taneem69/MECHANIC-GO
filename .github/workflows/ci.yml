name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # weekly: catches newly published vulnerabilities

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit (production deps must be clean)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SITE_URL: https://example.com

  codeql:
    # Static application security testing (SAST). Free for public repos;
    # private repos need GitHub Advanced Security.
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
