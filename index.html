<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MechanicGo — On-Demand Roadside Assistance &amp; Mobile Mechanics</title>
    <meta
      name="description"
      content="Book a certified mechanic who comes to you. Transparent pricing, real-time tracking and secure payments for roadside assistance, repairs and inspections."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="__SITE_URL__/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Twitter (read by link-preview bots that do not run JavaScript) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MechanicGo" />
    <meta property="og:title" content="MechanicGo — On-Demand Roadside Assistance" />
    <meta
      property="og:description"
      content="Certified mechanics that come to you. Transparent pricing, live tracking, secure payments."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MechanicGo — On-Demand Roadside Assistance" />
    <meta
      name="twitter:description"
      content="Certified mechanics that come to you. Transparent pricing, live tracking, secure payments."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <!-- Structured data (no ratings/addresses until they are real) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "MechanicGo",
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/icon-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "url": "__SITE_URL__/",
            "name": "MechanicGo",
            "publisher": { "@id": "__SITE_URL__/#organization" }
          },
          {
            "@type": "Service",
            "name": "On-demand roadside assistance and mobile mechanic service",
            "serviceType": "Roadside assistance and vehicle repair",
            "description": "Certified mechanics travel to the customer's location for roadside assistance, repairs, diagnostics and inspections.",
            "provider": { "@id": "__SITE_URL__/#organization" }
          }
        ]
      }
    </script>

    <!-- Critical styles: no white flash and a visible shell while the JS bundle loads -->
    <style>
      html,body{margin:0;background:#000;color:#fff}
      .boot{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:system-ui,sans-serif;text-align:center;padding:24px}
      .boot b{font-size:clamp(32px,8vw,56px);letter-spacing:.04em}
      .boot b span{color:#F7FF19}
      .boot p{margin:0;color:#9a9a9a;max-width:34ch}
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on load. Also gives crawlers/no-JS users real content. -->
      <div class="boot">
        <b>MECHANIC<span>GO</span></b>
        <h1 style="font-size:16px;font-weight:500;margin:0">On-demand roadside assistance</h1>
        <p>Certified mechanics that come to you. Transparent pricing, live tracking, secure payments.</p>
        <noscript><p>Please enable JavaScript to use MechanicGo.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
